apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: resultserver-deploy
  name: resultserver-deploy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: resultserver-deploy
  strategy: {}
  template:
    metadata:
      labels:
        app: resultserver-deploy
    spec:
      containers:
      - image: {{ .Values.resultserver_image }}
        name: resultserver
        ports:
        - containerPort: 80
        resources: {}
        envFrom:
          - configMapRef:
              name: mysql-cm
          - configMapRef:
              name: server-cm
          - secretRef:
              name: mysql-secret        
        # env:
        # - name: MYSQL_DATABASE_HOST
        #   value: "mysql"
        # - name: MYSQL_DATABASE
        #   value: "phonebook"
        # - name: MYSQL_USER
        #   value: "phonebook"
        # - name: MYSQL_PASSWORD
        #   value: "phonebook"