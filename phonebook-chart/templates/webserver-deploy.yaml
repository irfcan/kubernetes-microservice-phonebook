apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: webserver-deploy
  name: webserver-deploy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webserver-deploy
  strategy: {}
  template:
    metadata:
      labels:
        app: webserver-deploy
    spec:
      containers:
      - image: {{ .Values.webserver_image }}
        name: webserver
        ports:
        - containerPort: 80
        resources: {}
        envFrom:
          - configMapRef:
              name: mysql-cm
          - configMapRef:
              name: server-cm
          - secretRef:
              name: mysql-secret
        # env:
        # - name: MYSQL_DATABASE_HOST
        #   value: "mysql"
        # - name: MYSQL_DATABASE
        #   value: "phonebook"
        # - name: MYSQL_USER
        #   value: "phonebook"
        # - name: MYSQL_PASSWORD
        #   value: "phonebook"
